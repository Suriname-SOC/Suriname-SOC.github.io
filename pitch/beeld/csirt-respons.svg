<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">Het overheidsnetwerk krijgt een malwaremelding, de e-GOV-website staat offline en DNV-CSIRT coördineert de noodprotocollen met Datasur, Telesur, e-GOV en TAS.</title>
  <rect width="480" height="360" rx="14" fill="#183b31"/>
  <!-- verbindingen -->
  <g stroke="#f1be2b" stroke-width="2.4" stroke-dasharray="6 6" fill="none" opacity=".75">
    <path d="M240 214 L96 128"/>
    <path d="M240 214 L384 128"/>
    <path d="M240 214 L96 300"/>
    <path d="M240 214 L384 300"/>
  </g>
  <!-- scherm overheidsnetwerk -->
  <g>
    <rect x="152" y="18" width="176" height="104" rx="8" fill="#0c221c" stroke="#2c5f4c" stroke-width="2"/>
    <rect x="164" y="30" width="152" height="18" rx="3" fill="#b5362b"/>
    <text x="240" y="43.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fff">MALWARE GEDETECTEERD</text>
    <g fill="#cfdcd5" opacity=".55">
      <rect x="164" y="58" width="104" height="5" rx="2.5"/>
      <rect x="164" y="70" width="128" height="5" rx="2.5"/>
      <rect x="164" y="82" width="86" height="5" rx="2.5"/>
    </g>
    <text x="164" y="108" font-family="ui-monospace, monospace" font-size="11" fill="#f1be2b">e-gov.sr  ✕ offline</text>
    <rect x="226" y="122" width="28" height="10" fill="#2c5f4c"/>
    <rect x="206" y="132" width="68" height="6" rx="3" fill="#2c5f4c"/>
  </g>
  <!-- CSIRT-schild -->
  <g transform="translate(206 170)">
    <path d="M34 0 68 12v26c0 20-14 35-34 42C14 73 0 58 0 38V12Z" fill="#1f4a3a" stroke="#f1be2b" stroke-width="2.4"/>
    <path d="m34 20 3.6 11h11.6l-9.4 6.8 3.6 11-9.4-6.9-9.4 6.9 3.6-11-9.4-6.8h11.6Z" fill="#f1be2b"/>
  </g>
  <text x="240" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8faf8">DNV-CSIRT</text>
  <!-- partners -->
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17201d" text-anchor="middle">
    <rect x="40" y="110" width="112" height="36" rx="18" fill="#f8faf8"/><text x="96" y="132.5">Datasur</text>
    <rect x="328" y="110" width="112" height="36" rx="18" fill="#f8faf8"/><text x="384" y="132.5">Telesur</text>
    <rect x="40" y="282" width="112" height="36" rx="18" fill="#f8faf8"/><text x="96" y="304.5">e-GOV</text>
    <rect x="328" y="282" width="112" height="36" rx="18" fill="#f8faf8"/><text x="384" y="304.5">TAS</text>
  </g>
  <text x="240" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cfdcd5">mei 2024 · noodprotocollen</text>
</svg>
